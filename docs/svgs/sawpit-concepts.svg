        <path d="M2 7 26 19 37 14 13 2Z" fill="#c4a477"/><path d="M26 19 37 14 37 17 26 22Z" fill="#e0bd84"/>
      </g>
      <path d="M7 7 30 18M13 4 35 15" stroke="#e0bd84" stroke-width=".8"/>
    </symbol>
    <symbol id="sawyer" viewBox="0 0 20 34">
      <ellipse cx="10" cy="32" rx="9" ry="3" fill="#223b29" opacity=".2"/>
      <path d="M6 21 6 31M13 22 14 32" stroke="#594d38" stroke-width="3"/>
      <path d="M4 11 14 11 17 24 2 22Z" fill="#71806a" stroke="#4c594e" stroke-width=".8"/>
