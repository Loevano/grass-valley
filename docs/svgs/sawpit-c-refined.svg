      <g stroke="#735439" stroke-width=".9">
        <path d="M2 15 27 27 32 21 7 9Z" fill="#a47c4e"/>
        <ellipse cx="29" cy="24" rx="4" ry="5" transform="rotate(-25 29 24)" fill="#dbb580"/>
        <path d="M10 11 35 23 40 17 15 5Z" fill="#b48a56"/>
        <ellipse cx="37" cy="20" rx="4" ry="5" transform="rotate(-25 37 20)" fill="#dbb580"/>
        <path d="M5 7 30 19 35 13 10 1Z" fill="#b48a56"/>
        <ellipse cx="32" cy="16" rx="4" ry="5" transform="rotate(-25 32 16)" fill="#dbb580"/>
      </g>
      <path d="M28 23 30 25M36 19 38 21M31 15 33 17" stroke="#9c784b" stroke-width="1"/>
    </symbol>
    <symbol id="finished-boards" viewBox="0 0 40 34">
