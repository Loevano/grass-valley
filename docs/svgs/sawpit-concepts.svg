      <ellipse cx="78" cy="41" rx="2.5" ry="4" transform="rotate(-25 78 41)" fill="none" stroke="#9c784b"/>
      <path d="M16 11 68 37M19 5 71 31" stroke="#735439" stroke-width=".7"/>
    </symbol>
    <symbol id="pit-saw" viewBox="0 0 24 64">
