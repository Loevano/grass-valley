      <path d="M106 95 110 96 108 102 105 100Z" fill="#594d38"/>
      </g>
      <path d="M97 105 102 106 108 99M87 106 94 111 102 109" fill="none" stroke="#71806a" stroke-width="3"/>
      <path d="M105 102 108 99M100 109 104 108" stroke="#d3b68b" stroke-width="2"/>
      <!-- A few chips indicate cutting, leaving the walking edge uncluttered. -->
      <path d="M113 128 116 129 115 131 112 130ZM122 123 125 124 124 126 121 125ZM107 130 109 132 107 133 105 131Z" fill="#d3bc83"/>
    </symbol>
