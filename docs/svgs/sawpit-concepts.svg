      <path d="M89 81 130 91 127 99 122 97 118 101 114 98 110 101 106 98 102 100 98 97 94 99 89 96Z" fill="#c4d2ce" stroke="#68563e"/>
      <path d="M90 84 125 93" stroke="#e8efdf"/>
      <path d="M81 77 90 80 90 95 81 91Z" fill="#c4a477" stroke="#735439"/>
