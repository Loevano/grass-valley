      <path d="M95 108 144 84 144 57 95 81Z" fill="#847053" stroke="#594d38"/>
      <path d="M105 80 105 102M116 75 116 97M127 70 127 92M138 65 138 87" stroke="#a48d66" stroke-width=".8"/>
      <path d="M48 94 95 117 95 98 48 75Z" fill="#b69a70" stroke="#735439"/>
      <path d="M49 81 94 104M49 87 94 110" stroke="#947044" stroke-width=".8"/>
      <path d="M48 75 95 98 95 102 48 79Z" fill="#c4a477" stroke="#735439" stroke-width=".7"/>
      <!-- Posts and diagonal braces use the same material scale as the bench. -->
      <path d="M47 56 47 99 51 101 51 58ZM94 79 94 117 98 115 98 77ZM143 54 143 92 147 90 147 52Z" fill="#735439" stroke="#c4a477" stroke-width=".8"/>
      <path d="M50 67 62 62M143 63 133 68" stroke="#b48a56" stroke-width="2.5"/>
      <!-- Tool rack and a warm lantern sit behind the cutting station. -->
      <path d="M107 78 136 64" stroke="#594d38" stroke-width="2.5"/>
      <path d="M111 76 111 84M123 70 123 78M131 67 131 75" stroke="#c4a477" stroke-width="1.6"/>
      <path d="M108 83 114 80M120 76 126 73M128 73 134 70" stroke="#98aaa7" stroke-width="2"/>
      <path d="M54 60 54 68 59 70" fill="none" stroke="#735439" stroke-width="1.8"/>
      <path d="M54 68 59 70 59 77 54 75Z" fill="#edc77d" stroke="#594d38" stroke-width=".7"/>
      <!-- A compact pitched roof finishes the shed without covering the bench. -->
      <path d="M95 80 154 50 124 45Z" fill="#b69a70" stroke="#735439"/>
