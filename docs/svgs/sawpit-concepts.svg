  <rect width="1320" height="850" rx="16" fill="#172b27"/>
  <g font-family="system-ui, sans-serif" fill="#e8eadb">
    <text x="32" y="46" font-size="26" font-weight="650">Sawpit · three sketch ideas</text>
    <text x="32" y="75" font-size="14" fill="#bdcdb5">Existing palette and angled style · focus on recognizable work and silhouette</text>
    <g fill="#243f33" stroke="#51683e">
      <rect x="24" y="101" width="408" height="690" rx="10"/>
      <rect x="456" y="101" width="408" height="690" rx="10"/>
      <rect x="888" y="101" width="408" height="690" rx="10"/>
    </g>
    <text x="46" y="138" font-size="22" font-weight="650">A · Open pit</text>
    <text x="478" y="138" font-size="22" font-weight="650">B · Raised sawing deck</text>
    <text x="910" y="138" font-size="22" font-weight="650">C · Saw bench + rear shed</text>
    <g font-size="13" fill="#bdcdb5">
      <text x="46" y="165">The sawing action is the main shape.</text>
      <text x="478" y="165">The tall deck gives it a distinct silhouette.</text>
      <text x="910" y="165">A familiar saw shape on an open workbench.</text>
    </g>
    <use href="#concept-a" x="44" y="197" width="368" height="337"/>
    <use href="#concept-b" x="476" y="197" width="368" height="337"/>
    <use href="#concept-c" x="908" y="197" width="368" height="337"/>
    <g stroke="#51683e"><path d="M46 548H410M478 548H842M910 548H1274"/></g>
    <g font-size="13" fill="#bdcdb5">
      <text x="46" y="577">SMALL VIEW · approx. normal game size</text>
      <text x="478" y="577">SMALL VIEW · approx. normal game size</text>
      <text x="910" y="577">SMALL VIEW · approx. normal game size</text>
    </g>
    <use href="#concept-a" x="153" y="593" width="150" height="138"/>
    <use href="#concept-b" x="585" y="593" width="150" height="138"/>
    <use href="#concept-c" x="1017" y="593" width="150" height="138"/>
    <g font-size="14">
      <text x="46" y="749">Clearest view of the pit and both workers.</text>
      <text x="478" y="749">More structure; cutting stays fully visible.</text>
      <text x="910" y="749">Familiar tool profile; less literal pit.</text>
    </g>
    <text x="32" y="826" font-size="13" fill="#bdcdb5">Review sketches · work poses are illustrative · all three keep the existing 3×2 lot</text>
  </g>
</svg>
