  <rect width="1040" height="730" rx="16" fill="#172b27"/>
  <g font-family="system-ui, sans-serif" fill="#e8eadb">
    <text x="30" y="45" font-size="26" font-weight="650">Sawpit · refined concept C</text>
    <text x="30" y="74" font-size="14" fill="#bdcdb5">Rear timber shed + open sawing bench · existing palette and 3×2 footprint</text>
    <rect x="24" y="100" width="658" height="574" rx="10" fill="#243f33" stroke="#51683e"/>
    <rect x="702" y="100" width="314" height="574" rx="10" fill="#243f33" stroke="#51683e"/>
    <text x="44" y="133" font-size="14" fill="#bdcdb5">ENLARGED DESIGN VIEW</text>
    <use href="#refined-yard" x="43" y="151" width="620" height="521"/>
    <text x="722" y="133" font-size="16" font-weight="600">At normal game size</text>
    <use href="#refined-yard" x="779" y="151" width="160" height="135"/>
    <path d="M722 304H996" stroke="#51683e"/>
    <g font-size="15" font-weight="600">
      <text x="722" y="339">Clear work area</text>
      <text x="722" y="414">A useful rear shed</text>
      <text x="722" y="489">Better proportions</text>
      <text x="722" y="564">Readable materials</text>
    </g>
    <g font-size="13" fill="#bdcdb5">
      <text x="722" y="362">Log, saw and worker stay in front.</text>
      <text x="722" y="437">Half walls, tool rack and lantern.</text>
      <text x="722" y="512">Smaller saw; sturdy braced trestles.</text>
      <text x="722" y="587">Round logs in, squared boards out.</text>
