<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="850" viewBox="0 0 1320 850" role="img" aria-labelledby="title description">
  <title id="title">Lantern Vale — three sawpit sketch ideas</title>
  <desc id="description">Three proposed sawpit silhouettes in the existing angled timber-and-lantern style. A: an exposed pit with one sawyer above the log and one in the pit. B: a raised timber sawing deck with workers above and below. C: an open workbench with a familiar horizontal hand saw and a small rear shed. Each concept is shown enlarged and at approximately normal game size. These are review sketches, not implemented artwork.</desc>
  <defs>
    <symbol id="lot" viewBox="0 0 180 165">
      <path d="M12 99 105 53 167 84 74 130Z" fill="#a48d66" stroke="#6c715c" stroke-width="1"/>
      <path d="M18 103 75 131 164 88 164 91 75 135 18 107Z" fill="#8c7758"/>
    </symbol>
    <symbol id="logs" viewBox="0 0 42 30">
      <g stroke="#735439" stroke-width="1">
        <path d="M3 10 28 22 33 16 8 4Z" fill="#a47c4e"/>
        <ellipse cx="30" cy="19" rx="4" ry="5" transform="rotate(-25 30 19)" fill="#dbb580"/>
        <path d="M10 6 35 18 40 12 15 0Z" fill="#b48a56"/>
        <ellipse cx="37" cy="15" rx="4" ry="5" transform="rotate(-25 37 15)" fill="#dbb580"/>
        <path d="M5 3 30 15 35 9 10 -3Z" fill="#b48a56"/>
        <ellipse cx="32" cy="12" rx="4" ry="5" transform="rotate(-25 32 12)" fill="#dbb580"/>
      </g>
      <path d="M29 18 31 20M36 14 38 16M31 11 33 13" stroke="#9c784b" stroke-width="1"/>
    </symbol>
