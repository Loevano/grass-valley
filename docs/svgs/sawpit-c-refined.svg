        <path d="M2 11 26 23 37 18 13 6Z" fill="#c4a477"/><path d="M26 23 37 18 37 21 26 26Z" fill="#e0bd84"/>
        <path d="M2 7 26 19 37 14 13 2Z" fill="#c4a477"/><path d="M26 19 37 14 37 17 26 22Z" fill="#e0bd84"/>
      </g>
      <path d="M7 7 30 18M13 4 35 15" stroke="#e0bd84" stroke-width=".8"/>
      <path d="M18 10 18 23" stroke="#68563e" stroke-width="1.6"/>
    </symbol>
    <symbol id="refined-yard" viewBox="0 0 220 185">
      <!-- One connected lot, with the front path kept open around the bench. -->
      <path d="M17 113 129 57 203 94 91 150Z" fill="#a48d66" stroke="#6c715c"/>
      <path d="M17 113 91 150 91 153 17 116ZM91 150 203 94 203 97 91 153Z" fill="#8c7758"/>
      <path d="M45 99 99 126 161 95 107 68Z" fill="#735439" opacity=".18"/>
