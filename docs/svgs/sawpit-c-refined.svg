<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="730" viewBox="0 0 1040 730" role="img" aria-labelledby="title description">
  <title id="title">Lantern Vale — refined sawpit concept C</title>
  <desc id="description">A refined saw bench and rear timber shed in the existing angled game style. A small pitched roof, half walls, a hanging lantern and a tool rack form the rear shed. An open front bench has braced trestles, a log, a visible cutting mark and a proportionate toothed hand saw held by a worker. Round logs and finished square boards occupy separate sides of the existing three-by-two lot. The same drawing is also shown at approximately normal game size. This is an SVG design study awaiting review.</desc>
