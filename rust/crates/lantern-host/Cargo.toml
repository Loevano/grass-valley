[package]
name = "lantern-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
lantern-core = { path = "../lantern-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["float_roundtrip", "raw_value"] }
sha2 = { version = "0.10.9", default-features = false }
blake2 = { version = "0.10.6", default-features = false }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.49", features = ["rt-multi-thread", "net", "sync", "signal"] }
tower-http = { version = "0.6", features = ["fs"] }
form_urlencoded = "1.2"

[dev-dependencies]
# R09 offline comparison only; not part of the authoritative host.
pathfinding = "=4.16.0"
num-traits = "0.2.19"
