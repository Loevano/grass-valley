    </symbol>
    <symbol id="concept-c" viewBox="0 0 180 165">
      <use href="#lot" width="180" height="165"/>
      <use href="#logs" x="17" y="73" width="40" height="29"/>
      <!-- The roof covers only the back of the lot, leaving the work in front. -->
      <path d="M38 42 38 84 42 86 42 44ZM118 44 118 85 122 83 122 42ZM79 60 79 98 83 100 83 58Z" fill="#735439" stroke="#c4a477"/>
      <path d="M38 48 79 68 120 48M38 61 49 53M120 59 110 51" fill="none" stroke="#b48a56" stroke-width="3"/>
      <path d="M29 42 76 17 130 43 83 68Z" fill="#8e7752" stroke="#735439" stroke-width="1.5"/>
      <path d="M29 42 83 68 130 43" fill="none" stroke="#c9a579" stroke-width="2"/>
